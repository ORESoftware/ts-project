name: oreslang-pr17-test

on:
  push:
    branches: ["ci/oreslang-pr17-20261002"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
          cache-dependency-path: oreslang-pr17/pom.xml
      - name: Verify Oreslang PR 17 snapshot
        working-directory: oreslang-pr17
        run: mvn -B -ntp verify
